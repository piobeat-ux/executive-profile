name: Optimize executive portrait
on:
  push:
    paths:
      - '.github/workflows/optimize-portrait.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download source portrait and optimize for responsive delivery
        run: |
          python -m pip install --quiet pillow
          curl --fail --location --retry 3 --connect-timeout 12 --max-time 45 \
            "https://valeriy-grigorchuk-executive.vercel.app/portrait.jpg" -o /tmp/original-portrait.jpg
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open('/tmp/original-portrait.jpg').convert('RGB')
          print(f'Source: {im.size[0]} x {im.size[1]}')
          if im.width < 600:
              raise RuntimeError('Source image too small for requested quality')
          for width, quality in [(420, 80), (860, 83)]:
              target = min(width, im.width)
              height = round(target * im.height / im.width)
              output = Path(f'portrait-{width}.webp')
              im.resize((target, height), Image.Resampling.LANCZOS).save(
                  output, 'WEBP', quality=quality, method=6)
              print(f'{output}: {output.stat().st_size} bytes')
          PY
      - name: Commit optimized portrait assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portrait-420.webp portrait-860.webp
          git diff --cached --quiet || (git commit -m "Add high-resolution optimized executive portraits" && git push)
